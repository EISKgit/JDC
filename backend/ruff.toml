# Python lint rules (run: .venv/Scripts/python.exe -m ruff check .)
line-length = 120
target-version = "py312"
extend-exclude = ["migrations/versions"]  # generated by Alembic

[lint]
# E/W pycodestyle, F pyflakes (unused names, undefined vars), I import order,
# B bugbear (likely bugs), UP modern syntax, SIM simplifications.
select = ["E", "W", "F", "I", "B", "UP", "SIM"]
ignore = [
    "B008",   # FastAPI dependency injection uses `x = Depends(...)` in defaults
    "UP042",  # keep (str, Enum): StrEnum changes str() of values stored in the DB and sent to the AI
]

[lint.isort]
known-first-party = ["app"]
