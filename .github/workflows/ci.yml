# Runs every test on each push and pull request. Results show as a check mark
# (or a red cross) next to each commit on GitHub, under the "Actions" tab.
name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      # Tests use a throwaway SQLite DB and the rule-based AI: no secrets or network needed.
      - run: python -m pytest -q
      # Fails if any pinned dependency has a published security advisory.
      - name: Audit Python dependencies for known vulnerabilities
        run: pip-audit -r requirements.txt --progress-spinner off

  # The same backend tests against a real PostgreSQL server, so "switch DATABASE_URL to
  # Postgres" keeps working (migrations, enum types, constraints, queries).
  backend-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: jdc
          POSTGRES_PASSWORD: jdc-ci-password
          POSTGRES_DB: jdc_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jdc -d jdc_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://jdc:jdc-ci-password@localhost:5432/jdc_test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Audit npm dependencies for known vulnerabilities
        run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: npm run build
