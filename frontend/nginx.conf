# Serves the built React app and proxies the API, so browser and API share one origin.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;            # don't advertise the nginx version
    client_max_body_size 1m;      # matches the backend's MAX_REQUEST_BYTES

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Security headers are set per location below: the app's pages need framing
    # protection a <meta> CSP can't give, while /api and /health already get a stricter
    # set from the backend itself (nginx would otherwise send both).

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;   # AI answers can take a few seconds
    }

    location = /health {
        proxy_pass http://backend:8000/health;
    }

    # Built files have content hashes in their names: cache them for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Single-page app: unknown paths (e.g. /updates?date=...) get index.html, never cached
    # so a new deploy is picked up immediately.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        try_files $uri /index.html;
    }
}
